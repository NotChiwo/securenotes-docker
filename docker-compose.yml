services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://securenotes:securenotes@db:5432/securenotes
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: securenotes
      POSTGRES_PASSWORD: securenotes
      POSTGRES_DB: securenotes
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securenotes -d securenotes"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
